[project]
name = "carro-rl"
version = "0.1.0"
description = "Entorno Gymnasium: carro con derrape y sensores de distancia en una pista cerrada"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "numpy",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carro_rl"]

[tool.pytest.ini_options]
pythonpath = ["."]
